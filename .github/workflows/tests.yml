name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install exactly what uv.lock pins
        run: uv sync --locked --extra dev --extra viz
      - name: Run the suite (fails under 80% coverage)
        run: uv run pytest --cov=nabla --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .

  lockfile:
    # uv.lock must match pyproject.toml, and requirements.txt must match uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check
      - name: requirements.txt is the pinned export of uv.lock
        run: |
          uv export --frozen --extra dev --extra viz --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

  audit:
    # known vulnerabilities in any pinned dependency fail the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt

  experiment:
    # the config-driven MNIST run, end to end: download, train, record, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra viz
      - name: Train from configs/mnist_ci.json
        run: uv run python examples/train_mnist.py --config configs/mnist_ci.json --no-plots
      - name: The recorded run must reach 94% test accuracy
        run: uv run python -m nabla.training.runs check runs --name mnist --metric test_accuracy --min 0.94
      - uses: actions/upload-artifact@v4
        with:
          name: mnist-run-record
          path: runs/mnist_*.json

  docker:
    # the Dockerfile (also used by the devcontainer) builds and its suite passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nabla .
      - run: docker run --rm nabla
